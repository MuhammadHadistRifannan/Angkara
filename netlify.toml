[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Header keamanan dasar untuk semua rute
# Catatan: CSP tidak ditambahkan di sini karena Leaflet (tiles), Supabase (Auth/Realtime), dan Google Fonts
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Cache immutable untuk bundel aset ter-hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html tidak boleh di-cache agar rilis baru langsung aktif
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
