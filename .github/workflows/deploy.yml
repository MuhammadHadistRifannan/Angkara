name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  deploy:
    name: Deploy to Production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (Production)
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'dxXKVkjzTwPTOUzwIkTlHUSl' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_yWJXOmOqbAr5SsIpk8157ijMD7Mq' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN tidak ditemukan di GitHub secrets!"
            exit 1
          fi

          echo "Memulai deploy produksi ke Vercel..."
          deploy_url=$(npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes)
          echo "Vercel Deploy URL: $deploy_url"
          echo "deploy_url=$deploy_url" >> $GITHUB_OUTPUT

      - name: Smoke test deployed site
        run: |
          PROD_URL="https://suar-cilacap.vercel.app"
          echo "Target Production URL: $PROD_URL"

          success=false
          for i in 1 2 3; do
            echo "Attempt $i: Memverifikasi URL root dan SPA fallback..."
            
            root_content=$(curl -fsS "$PROD_URL" || true)
            dashboard_code=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/dashboard" || true)

            has_root_id=false
            if echo "$root_content" | grep -q 'id="root"'; then
              has_root_id=true
            fi

            if [ "$has_root_id" = true ] && [ "$dashboard_code" = "200" ]; then
              echo "Smoke test sukses pada percobaan ke-$i: HTTP 200 dan root container ditemukan."
              success=true
              break
            fi

            echo "Percobaan ke-$i belum berhasil (root id: $has_root_id, dashboard HTTP: $dashboard_code). Menunggu 5 detik..."
            sleep 5
          done

          if [ "$success" = false ]; then
            echo "Smoke test gagal setelah 3 percobaan."
            exit 1
          fi
