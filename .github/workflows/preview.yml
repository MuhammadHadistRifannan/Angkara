name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_verify.yml

  preview:
    name: Deploy PR Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy Preview to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27.16.3 deploy \
            --dir=dist \
            --no-build \
            --alias=pr-${{ github.event.number }} \
            --json > preview-output.json

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('preview-output.json', 'utf8'));
            const previewUrl = data.deploy_url || data.url;
            const marker = '<!-- netlify-preview-comment -->';
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = `${marker}\n### 🚀 Netlify Deploy Preview\n\n- **Preview URL:** [${previewUrl}](${previewUrl})\n- **Commit:** \`${commitSha}\`\n- **PR:** #${context.issue.number}\n\n*Deploy preview diperbarui secara otomatis setiap ada push baru pada PR ini.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              console.log(`Updated existing PR comment ID ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new PR preview comment');
            }
