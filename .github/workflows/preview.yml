name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_verify.yml

  preview:
    name: Deploy PR Preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy Preview to Vercel
        id: vercel-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'dxXKVkjzTwPTOUzwIkTlHUSl' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_yWJXOmOqbAr5SsIpk8157ijMD7Mq' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN tidak ditemukan di GitHub secrets!"
            exit 1
          fi

          echo "Memulai deploy preview ke Vercel..."
          preview_url=$(npx --yes vercel deploy --token="$VERCEL_TOKEN" --yes)
          echo "Vercel Preview URL: $preview_url"
          echo "preview_url=$preview_url" >> $GITHUB_OUTPUT

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = "${{ steps.vercel-preview.outputs.preview_url }}";
            const marker = '<!-- vercel-preview-comment -->';
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = `${marker}\n### 🚀 Vercel Deploy Preview\n\n- **Preview URL:** [${previewUrl}](${previewUrl})\n- **Commit:** \`${commitSha}\`\n- **PR:** #${context.issue.number}\n\n*Deploy preview diperbarui secara otomatis setiap ada push baru pada PR ini.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              console.log(`Updated existing PR comment ID ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new PR preview comment');
            }
